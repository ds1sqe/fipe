[package]
name = "fipe-cli"
version.workspace = true
edition.workspace = true
description = "The fipe command: run, check, build and talk to Fipe scripts"
license.workspace = true
repository.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE-*", "/Cargo.lock"]

[[bin]]
name = "fipe"
path = "src/main.rs"

[dependencies]
fipe.workspace = true
fipe-host.workspace = true
fipe-llvm.workspace = true
fipe-native.workspace = true
fipe-repl.workspace = true

[lints.rust]
unsafe_code = "forbid"
