[package]
name = "tree-sitter-fipe"
description = "Fipe grammar for tree-sitter"
version.workspace = true
authors = ["Kim Dae Up <ds1sqe@mensakorea.org>"]
license.workspace = true
keywords = ["incremental", "parsing", "tree-sitter", "fipe"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "README.md",
  "LICENSE-*",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
fipe.workspace = true
tree-sitter = "0.25.10"
