[package]
name = "fipe-repl"
version = "0.1.0"
edition = "2021"
description = "The Fipe REPL program"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "fipe_repl"
path = "src/lib.rs"
# A test harness links std, which the `linux` platform must not.
test = false
doctest = false
bench = false

[[bin]]
name = "fipe-repl"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["std"]
std = []
linux = []

[dependencies]
fipe = { path = "../.." }
fipe-repl-core = { path = "../repl-core" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
