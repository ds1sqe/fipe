[package]
name = "fipe-repl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Fipe REPL program"
license.workspace = true
repository.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE-*", "/Cargo.lock"]

[lib]
name = "fipe_repl"
path = "src/lib.rs"
# A test harness links std, which the `linux` platform must not.
test = false
doctest = false
bench = false

[[bin]]
name = "fipe-repl"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["std"]
std = []
linux = []

[dependencies]
fipe.workspace = true
fipe-repl-core.workspace = true
