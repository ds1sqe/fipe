[package]
name = "fipe-lsp"
version.workspace = true
edition.workspace = true
description = "A language server for Fipe over the fipe crate"
license.workspace = true
repository.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE-*", "/Cargo.lock"]

[[bin]]
name = "fipe-lsp"
path = "src/main.rs"

[dependencies]
fipe.workspace = true
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
