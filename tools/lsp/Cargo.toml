[package]
name = "fipe-lsp"
version = "0.1.0"
edition = "2021"
description = "A language server for Fipe over the fipe crate"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "fipe-lsp"
path = "src/main.rs"

[dependencies]
fipe = { path = "../.." }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
