[package]
name = "fipe-dap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A debug adapter for Fipe over the Debug Adapter Protocol"
license.workspace = true
repository.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE-*", "/Cargo.lock"]

[[bin]]
name = "fipe-dap"
path = "src/main.rs"

[dependencies]
fipe.workspace = true
fipe-host.workspace = true
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
