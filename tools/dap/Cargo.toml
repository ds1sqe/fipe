[package]
name = "fipe-dap"
version = "0.1.0"
edition = "2021"
description = "A debug adapter for Fipe over the Debug Adapter Protocol"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "fipe-dap"
path = "src/main.rs"

[dependencies]
fipe = { path = "../.." }
fipe-host = { path = "../host" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
