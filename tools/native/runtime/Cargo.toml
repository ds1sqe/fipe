[package]
name = "fipe-native-rt"
version = "0.1.0"
edition = "2021"
description = "The runtime the code of Fipe's native backend links against"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
fipe = { path = "../../.." }
fipe-host = { path = "../../host" }

# Nothing unwinds across machine code.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
